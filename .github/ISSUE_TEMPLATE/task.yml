name: Engineering task
description: Define an objective, its requirement, acceptance and evidence.
title: ''
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective and reason
      description: Describe the resulting behavior and why this change is needed.
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: Requirements and boundaries
      description: Cite applicable company requirements, affected rubric workflows and scope limits. Record conflicts before changing code.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and dependencies
      description: Name observable checks, dependent Issues and required post-integration checks/documentation/cleanup. Ready for integration remains open/In progress; completed requires the full acceptance gate.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and outcome
      description: Record start, material scope change, concrete block, approach-changing failure and validation. Before explicit closure include outcome, acceptance, PR/integrated commit, checks/CI, limitations and resource closure. No command diary, invented runs or private data.
