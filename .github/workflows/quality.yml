name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:structure
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            shard: 1/1
          - project: chromium-mobile
            shard: 1/2
          - project: chromium-mobile
            shard: 2/2
          - project: firefox-desktop
            shard: 1/1
          - project: chromium-focus
            shard: 1/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_SKIP_BROWSER_GC=1 npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: xvfb-run -a npx playwright test --project "${{ matrix.project }}" --shard "${{ matrix.shard }}" --no-deps --workers 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}
          path: artifacts/playwright/
          retention-days: 7

  verify:
    if: ${{ always() }}
    needs: [source, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all source and browser checks
        env:
          SOURCE_CHECKS: ${{ needs.source.result }}
          BROWSER_CHECKS: ${{ needs.browser.result }}
        run: |
          test "$SOURCE_CHECKS" = success
          test "$BROWSER_CHECKS" = success
